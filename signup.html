<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - StockManager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="logo">📦 StockManager</a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
                    <span id="themeIcon">🌙</span>
                </button>
                <div class="nav-links">
                    <a href="login.html" class="btn-small">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Signup Container -->
    <div class="auth-container">
        <div class="auth-box">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join StockManager today</p>
            
            <form id="signupForm" class="form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label for="shopName">Shop Name</label>
                    <input type="text" id="shopName" name="shopName" required placeholder="Enter your shop name">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                </div>

                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <div class="auth-link">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>

            <div id="signupMessage" class="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
