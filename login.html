<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StockManager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="logo">📦 StockManager</a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
                    <span id="themeIcon">🌙</span>
                </button>
                <div class="nav-links">
                    <a href="signup.html" class="btn-small btn-primary">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="auth-container">
        <div class="auth-box">
            <h2>Login</h2>
            <p class="auth-subtitle">Welcome back to StockManager</p>
            
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="loginEmail" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="loginPassword" required placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <div class="auth-link">
                <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
            </div>

            <div id="loginMessage" class="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
